#
# Shared upstreams - authentic outpost
#

upstream platform_auth  {
    server 192.168.55.11:9000;
}

#
# Catch anything we have not explicitly configured
#

server {
    listen 80 default_server;
    server_name _;

    location = /haproxy-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        return 404;
    }
}


#
# ============================================================
# EA VIEWER
# https://ea.lambeth.architechsure.net
# ============================================================
#
server {
    listen 80;
    server_name ea.lambeth.architechsure.net;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;


    #
    # ------------------------------------------------------------
    # Values returned by Authentik after successful authentication
    # ------------------------------------------------------------
    #

    auth_request_set $auth_cookie
        $upstream_http_set_cookie;

    auth_request_set $authentik_username
        $upstream_http_x_authentik_username;

    auth_request_set $authentik_groups
        $upstream_http_x_authentik_groups;

    auth_request_set $authentik_email
        $upstream_http_x_authentik_email;

    auth_request_set $authentik_name
        $upstream_http_x_authentik_name;

    auth_request_set $authentik_uid
        $upstream_http_x_authentik_uid;


    #
    # ------------------------------------------------------------
    # Existing Essential Viewer logout link
    #
    # Viewer currently sends the user to:
    # /oauth2/sign_out
    #
    # Translate that to the Authentik outpost logout endpoint.
    # ------------------------------------------------------------
    #

    location = /oauth2/sign_out {
        auth_request off;

        return 302 /outpost.goauthentik.io/sign_out;
    }


    #
    # ------------------------------------------------------------
    # Authentik embedded outpost
    # ------------------------------------------------------------
    #

    location /outpost.goauthentik.io {
        auth_request off;

        proxy_pass
            http://platform_auth/outpost.goauthentik.io;

        #
        # Preserve the public application hostname
        #
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;

        #
        # HTTPS was terminated by HAProxy
        #
        proxy_set_header X-Forwarded-Proto https;

        #
        # Tell Authentik which external URL was requested
        #
        proxy_set_header X-Original-URL
            https://$http_host$request_uri;

        #
        # Pass bearer/authentication headers if present
        #
        proxy_set_header Authorization
            $http_authorization;

        #
        # Do not send the original request body to the auth check
        #
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }


    #
    # ------------------------------------------------------------
    # Redirect an unauthenticated browser into the Authentik flow
    # ------------------------------------------------------------
    #

    location @goauthentik_proxy_signin {
        internal;

        add_header Set-Cookie $auth_cookie;

        return 302
            /outpost.goauthentik.io/start?rd=https://$http_host$request_uri;
    }


    #
    # ------------------------------------------------------------
    # Import Utility must NOT be available through the Viewer host
    # ------------------------------------------------------------
    #

    location /essential_import_utility/ {
        auth_request off;

        return 404;
    }


    #
    # ------------------------------------------------------------
    # Essential Viewer
    # ------------------------------------------------------------
    #

    location / {

        #
        # Ask Authentik whether this request may proceed
        #
        auth_request /outpost.goauthentik.io/auth/nginx;

        #
        # Unauthenticated user -> Authentik login
        #
        error_page 401 = @goauthentik_proxy_signin;

        #
        # Return Authentik session cookie to browser
        #
        add_header Set-Cookie $auth_cookie;

        #
        # Actual Essential Viewer
        #
        proxy_pass http://essential-viewer:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        #
        # External connection is HTTPS even though HAProxy -> Nginx is HTTP
        #
        proxy_set_header X-Forwarded-Proto https;


        #
        # Make Authentik identity available to the application
        # if we want to use it later.
        #
        proxy_set_header X-authentik-username
            $authentik_username;

        proxy_set_header X-authentik-groups
            $authentik_groups;

        proxy_set_header X-authentik-email
            $authentik_email;

        proxy_set_header X-authentik-name
            $authentik_name;

        proxy_set_header X-authentik-uid
            $authentik_uid;
    }
}

#
# ============================================================
# EA IMPORT
# https://ea-import.demo.architechsure.net
# ============================================================
#
server {
    listen 80;
    server_name ea-import.lambeth.architechsure.net;

    client_max_body_size 20m;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;


    #
    # ------------------------------------------------------------
    # Values returned by Authentik
    # ------------------------------------------------------------
    #

    auth_request_set $auth_cookie
        $upstream_http_set_cookie;

    auth_request_set $authentik_username
        $upstream_http_x_authentik_username;

    auth_request_set $authentik_groups
        $upstream_http_x_authentik_groups;

    auth_request_set $authentik_email
        $upstream_http_x_authentik_email;

    auth_request_set $authentik_name
        $upstream_http_x_authentik_name;

    auth_request_set $authentik_uid
        $upstream_http_x_authentik_uid;


    #
    # ------------------------------------------------------------
    # Logout
    # ------------------------------------------------------------
    #

    location = /oauth2/sign_out {
        auth_request off;
        return 302 /outpost.goauthentik.io/sign_out;
    }


    #
    # ------------------------------------------------------------
    # Authentik outpost
    # ------------------------------------------------------------
    #

    location /outpost.goauthentik.io {
        auth_request off;

        proxy_pass
            http://platform_auth/outpost.goauthentik.io;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header X-Original-URL
            https://$http_host$request_uri;

        proxy_set_header Authorization
            $http_authorization;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }


    #
    # ------------------------------------------------------------
    # Redirect unauthenticated browser to Authentik
    # ------------------------------------------------------------
    #

    location @goauthentik_proxy_signin {
        internal;

        add_header Set-Cookie $auth_cookie;

        return 302
            /outpost.goauthentik.io/start?rd=https://$http_host$request_uri;
    }


    #
    # ------------------------------------------------------------
    # Friendly root redirect
    # ------------------------------------------------------------
    #

    location = / {
        auth_request off;

        return 302 /essential_import_utility/;
    }


    #
    # ------------------------------------------------------------
    # Essential Import Utility
    # ------------------------------------------------------------
    #

    location /essential_import_utility/ {
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @goauthentik_proxy_signin;

        add_header Set-Cookie $auth_cookie;

        #
        # Import Utility is currently served by the same
        # Tomcat/viewer endpoint.
        #
        proxy_pass http://essential-viewer:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header X-authentik-username
            $authentik_username;

        proxy_set_header X-authentik-groups
            $authentik_groups;

        proxy_set_header X-authentik-email
            $authentik_email;

        proxy_set_header X-authentik-name
            $authentik_name;

        proxy_set_header X-authentik-uid
            $authentik_uid;
    }


    #
    # ------------------------------------------------------------
    # Do not expose anything else through the Import hostname
    # ------------------------------------------------------------
    #

    location / {
        auth_request off;
        return 404;
    }
}
#
# ============================================================
# EA ADMIN
# https://ea-admin.lambeth.architechsure.net
# ============================================================
#
server {
    listen 80;
    server_name ea-admin.lambeth.architechsure.net;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;


    #
    # ------------------------------------------------------------
    # Values returned by Authentik
    # ------------------------------------------------------------
    #

    auth_request_set $auth_cookie
        $upstream_http_set_cookie;

    auth_request_set $authentik_username
        $upstream_http_x_authentik_username;

    auth_request_set $authentik_groups
        $upstream_http_x_authentik_groups;

    auth_request_set $authentik_email
        $upstream_http_x_authentik_email;

    auth_request_set $authentik_name
        $upstream_http_x_authentik_name;

    auth_request_set $authentik_uid
        $upstream_http_x_authentik_uid;


    #
    # ------------------------------------------------------------
    # Logout
    # ------------------------------------------------------------
    #

    location = /oauth2/sign_out {
        auth_request off;
        return 302 /outpost.goauthentik.io/sign_out;
    }


    #
    # ------------------------------------------------------------
    # Authentik outpost
    # ------------------------------------------------------------
    #

    location /outpost.goauthentik.io {
        auth_request off;

        proxy_pass
            http://platform_auth/outpost.goauthentik.io;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header X-Original-URL
            https://$http_host$request_uri;

        proxy_set_header Authorization
            $http_authorization;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }


    #
    # ------------------------------------------------------------
    # Redirect unauthenticated browser to Authentik
    # ------------------------------------------------------------
    #

    location @goauthentik_proxy_signin {
        internal;

        add_header Set-Cookie $auth_cookie;

        return 302
            /outpost.goauthentik.io/start?rd=https://$http_host$request_uri;
    }


    #
    # ------------------------------------------------------------
    # LIVE API
    #
    # https://ea-admin.lambeth.architechsure.net/api/
    #
    # Repository:
    # EssentialAM/Repository
    # ------------------------------------------------------------
    #

    location /api/ {
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @goauthentik_proxy_signin;

        add_header Set-Cookie $auth_cookie;

        proxy_pass http://essential-api:5100;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header X-authentik-username
            $authentik_username;

        proxy_set_header X-authentik-groups
            $authentik_groups;

        proxy_set_header X-authentik-email
            $authentik_email;

        proxy_set_header X-authentik-name
            $authentik_name;

        proxy_set_header X-authentik-uid
            $authentik_uid;
    }


    #
    # ------------------------------------------------------------
    # QA API
    #
    # Public path:
    # https://ea-admin.lambeth.architechsure.net/qa-api/
    #
    # Backend:
    # essential-api-qa:5100/api/
    #
    # Repository:
    # EssentialAM/Repository-QA
    # ------------------------------------------------------------
    #

    location = /qa-api {
        return 302 /qa-api/;
    }

    location /qa-api/ {
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @goauthentik_proxy_signin;

        add_header Set-Cookie $auth_cookie;

        #
        # Convert:
        # /qa-api/classes/Business_Capability/instances
        #
        # to:
        # /api/classes/Business_Capability/instances
        #
        rewrite ^/qa-api/(.*)$ /api/$1 break;

        proxy_pass http://essential-api-qa:5100;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header X-authentik-username
            $authentik_username;

        proxy_set_header X-authentik-groups
            $authentik_groups;

        proxy_set_header X-authentik-email
            $authentik_email;

        proxy_set_header X-authentik-name
            $authentik_name;

        proxy_set_header X-authentik-uid
            $authentik_uid;
    }


    #
    # ------------------------------------------------------------
    # LIVE Swagger / API documentation resources
    # ------------------------------------------------------------
    #

    location /flasgger_static/ {
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @goauthentik_proxy_signin;

        add_header Set-Cookie $auth_cookie;

        proxy_pass http://essential-api:5100;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }


    location = /apispec.json {
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @goauthentik_proxy_signin;

        add_header Set-Cookie $auth_cookie;

        proxy_pass http://essential-api:5100;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }


    #
    # ------------------------------------------------------------
    # Admin UI
    #
    # Keep this LAST so the more specific API locations above
    # are selected first.
    # ------------------------------------------------------------
    #

    location / {
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @goauthentik_proxy_signin;

        add_header Set-Cookie $auth_cookie;

        proxy_pass http://essential-admin:80/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header X-authentik-username
            $authentik_username;

        proxy_set_header X-authentik-groups
            $authentik_groups;

        proxy_set_header X-authentik-email
            $authentik_email;

        proxy_set_header X-authentik-name
            $authentik_name;

        proxy_set_header X-authentik-uid
            $authentik_uid;
    }
}

#
# ============================================================
# EA API
# https://ea-api.demo.architechsure.net
# ============================================================
#
server {
    listen 80;
    server_name ea-api.lambeth.architechsure.net;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;


    #
    # ------------------------------------------------------------
    # Identity returned by Authentik
    # ------------------------------------------------------------
    #

    auth_request_set $auth_cookie
        $upstream_http_set_cookie;

    auth_request_set $authentik_username
        $upstream_http_x_authentik_username;

    auth_request_set $authentik_groups
        $upstream_http_x_authentik_groups;

    auth_request_set $authentik_entitlements
        $upstream_http_x_authentik_entitlements;

    auth_request_set $authentik_email
        $upstream_http_x_authentik_email;

    auth_request_set $authentik_name
        $upstream_http_x_authentik_name;

    auth_request_set $authentik_uid
        $upstream_http_x_authentik_uid;


    #
    # ------------------------------------------------------------
    # Authentik outpost
    #
    # Must remain publicly reachable because Nginx uses this
    # endpoint to validate the bearer token.
    # ------------------------------------------------------------
    #

    location /outpost.goauthentik.io {
        auth_request off;

        proxy_pass
            http://platform_auth/outpost.goauthentik.io;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header X-Original-URL
            https://$http_host$request_uri;

        #
        # Critical for API authentication:
        # pass incoming Bearer token to Authentik.
        #
        proxy_set_header Authorization
            $http_authorization;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }


    #
    # ------------------------------------------------------------
    # Friendly API root
    # ------------------------------------------------------------
    #

    location = / {
        return 302 /api/;
    }


    #
    # ------------------------------------------------------------
    # Essential API
    # ------------------------------------------------------------
    #

    location /api/ {

        #
        # Validate with Authentik
        #
        auth_request
            /outpost.goauthentik.io/auth/nginx;

        #
        # IMPORTANT:
        # Unlike Viewer/Admin, there is NO:
        #
        # error_page 401 = @goauthentik_proxy_signin;
        #
        # An API caller must therefore authenticate rather
        # than being redirected to an HTML login page.
        #

        proxy_pass http://essential-api:5100;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;


        #
        # Authenticated identity supplied by Authentik
        #

        proxy_set_header X-authentik-username
            $authentik_username;

        proxy_set_header X-authentik-groups
            $authentik_groups;

        proxy_set_header X-authentik-entitlements
            $authentik_entitlements;

        proxy_set_header X-authentik-email
            $authentik_email;

        proxy_set_header X-authentik-name
            $authentik_name;

        proxy_set_header X-authentik-uid
            $authentik_uid;


        #
        # Do NOT pass the Authentik bearer credential on to
        # Essential after authentication has succeeded.
        #
        proxy_set_header Authorization "";
    }


    #
    # ------------------------------------------------------------
    # API documentation resources
    # ------------------------------------------------------------
    #

    location /flasgger_static/ {

        auth_request
            /outpost.goauthentik.io/auth/nginx;

        proxy_pass http://essential-api:5100;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Authorization "";
    }


    location = /apispec.json {

        auth_request
            /outpost.goauthentik.io/auth/nginx;

        proxy_pass http://essential-api:5100;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Authorization "";
    }


    #
    # Do not expose unexpected paths
    #

    location / {
        return 404;
    }
}