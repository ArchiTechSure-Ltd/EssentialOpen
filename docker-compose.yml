name: essentiallambeth
services:  
  essential-nginx-noauth:
    platform: linux/amd64
    image: nginx:1.29-alpine
    ports:
      - "7083:80"
    volumes:
      - ${INSTANCE_ROOT}/nginx/nginx-noauth.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - essential-viewer
      - essential-api
      - essential-admin
  
  essential-viewer:
    platform: linux/amd64
    build: 
      context: viewer
    volumes:
      - ${INSTANCE_ROOT}/EssentialAM/essential_viewer:/usr/local/tomcat/webapps/essential_viewer
      
    # Import Utility persistent configuration
      - ${INSTANCE_ROOT}/import-utility/config:/usr/local/tomcat/webapps/essential_import_utility/config
    # Import definitions, specifications, spreadsheets and logs
      - ${INSTANCE_ROOT}/import-utility/import_activities:/usr/local/tomcat/webapps/essential_import_utility/import_activities
    # Managed QA and Live repositories
      - ${INSTANCE_ROOT}/import-utility/repository_cache:/usr/local/tomcat/webapps/essential_import_utility/repository_cache

  #  ports:
    #  - 7080:8080
    expose:
     - "8080"
    env_file:
      - ./env_file.env
  
  essential-api:
    image: architechsure/essential-open-api:1.0-server
    pull_policy: never
    build:
      context: /mnt/user/appdata/architechsure-platform/src/essential-open-api
      dockerfile: Dockerfile
    platform: linux/amd64
    expose:
      - "5100" 
    environment:
      FLASK_APP: wsgi.py
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: "5100"
      FLASK_DEBUG: "1"
      JARS_DIR: "/app/jars"
    command: flask run
    env_file:
      - ./env_file.env

  
  essential-api-qa:
    build:
      context: https://github.com/terryvel/essential-open-api.git#main
      dockerfile: Dockerfile
    platform: linux/amd64
    volumes:
      - ${INSTANCE_ROOT}/import-utility/repository_cache/repository_qa:/app/resources/essential
  #  ports:
     # - "5100:5100"
    expose:
      - "5100" 
    environment:
      FLASK_APP: wsgi.py
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: "5100"
      FLASK_DEBUG: "1"
      PPRJ_FILE: "/app/resources/essential/essential_baseline_6_21_0.pprj"
      JARS_DIR: "/app/jars"
      PPRJ_DIR: "/app/resources/essential"
    command: flask run
    depends_on:
      - essential-viewer

  essential-admin:
    build:
      context: https://github.com/terryvel/essential-open-admin.git#main
      dockerfile: Dockerfile
    platform: linux/amd64
   # ports:
    #  - "7081:80"
    expose:
      - "80"
    environment:
      - API_ORIGIN=
      - VIEWER_URL=${VIEWER_URL:-http://essential-viewer:8080/essential_viewer}
      - VIEWER_USER=${VIEWER_USER:-publisher}
    env_file:
      - ./env_file.env